# This file is an example config file for corexy (and also h-bot)
# style printers. One may copy and edit this file to configure a new
# corexy printer.

# DO NOT COPY THIS FILE WITHOUT CAREFULLY READING AND UPDATING IT
# FIRST. Incorrectly configured parameters may cause damage.

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PD14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF0
dir_pin: PF1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop
position_min: -0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_max: 200

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PH6

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30


[bltouch]
sensor_pin: ^PB5
control_pin: PB6
# Offsets
x_offset: -25 # estimate, will need to be calibrated!!
y_offset: -5 # estimate, will need to be calibrated!!
z_offset: 0 # estimate, will need to be calibrated!!
speed: 5
samples: 2 # Probe twice
sample_retract_dist: 3.0

# Bed Tilt section

[safe_z_home]
home_xy_position: 100,100
speed: 50
z_hop: 10
z_hop_speed: 5

[screws_tilt_adjust]
screw1: # X, Y coords
screw1_name: front_left
screw2: # X, Y coords
screw2_name: front_right
screw3: # X, Y coords
screw3_name: back_center
horizontal_move_z: 10
speed: 50
screw_thread: CW-M3 # CCW-M3 if counter clockwise thread, CW-M3 if clockwise thread

[z_tilt]
z_positions:
    #X,Y of Z1 Motor
    #X,Y of Z2 Motor
    #X,Y of Z3 Motor
points:
    #x,y probe point for Z1
    #x,y probe point for Z2
    #x,y probe point for Z3
speed: 50
horizontal_move_z: 10
retry_tolerance: 0.05

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 10,10
mesh_max: 190,190
probe_count: 5,5
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0

[gcode_macro PRINT_START]
description: G-code to run at the start of a print
gcode:
    G28 ; Home all axes
    Z_TILT_ADJUST ; Adjust bed tilt
    BED_MESH_CALIBRATE ; Calibrate bed mesh
    #
